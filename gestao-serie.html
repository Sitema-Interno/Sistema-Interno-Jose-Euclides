<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="theme-color" content="#15438c">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Séries - EEMTI Dr. José Euclides</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="portal-core.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap');

    :root {
      --azul-primario: #15438c;
      --azul-escuro: #0f2952;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef4fb 50%, #f1f5f9 100%);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    .watermark-brasao-fundo {
      position: fixed;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55vw;
      max-width: 600px;
      opacity: 0.06;
      z-index: 0;
      pointer-events: none;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .top-header {
      padding: 16px 25px 10px 25px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 15px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 5;
    }

    .brand-escola {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
    }

    .brand-escola img {
      height: 80px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.08));
    }

    .brand-titulo-principal {
      font-weight: 900;
      font-size: 1.75rem;
      color: var(--azul-primario);
      letter-spacing: 0.5px;
      line-height: 1.02;
      text-transform: uppercase;
      margin: 0;
    }

    .brand-subtitulo {
      font-weight: 800;
      font-size: 0.65rem;
      color: #1e3a8a;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .brand-slogan {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      color: var(--azul-primario);
      margin-top: 1px;
      line-height: 1;
    }

    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(21, 67, 140, 0.15);
    }

    .main-container {
      padding: 16px 15px 40px 15px;
      max-width: 1020px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      position: relative;
      z-index: 5;
    }

    .card {
      border: 1px solid rgba(21, 67, 140, 0.12);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.97);
    }

    .card-header-custom {
      border-bottom: 2px solid #e2e8f0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title-text {
      font-weight: 800;
      color: var(--azul-primario);
      font-size: 1.02rem;
      margin: 0;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }

    .form-control {
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 9px 13px;
      font-size: 0.88rem;
      background-color: #f8fafc;
    }

    .form-control:focus {
      border-color: var(--azul-primario);
      box-shadow: 0 0 0 0.2rem rgba(21, 67, 140, 0.15);
      background-color: #ffffff;
    }

    .btn-tema {
      background-color: var(--azul-primario);
      color: #ffffff;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 9px;
      border: none;
      transition: 0.2s;
    }

    .btn-tema:hover {
      background-color: var(--azul-escuro);
      color: #ffffff;
    }

    .table th {
      background-color: #f8fafc;
      font-size: 0.76rem;
      color: #475569;
      font-weight: 800;
      text-transform: uppercase;
      padding: 11px 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .table td {
      padding: 11px 10px;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .btn-acao {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: none;
    }

    .btn-editar { background-color: #ffc107; color: #000; }
    .btn-excluir { background-color: #dc3545; color: #fff; }

    .footer-custom {
      text-align: center;
      padding: 14px;
      font-size: 0.8rem;
      color: #64748b;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      background: rgba(255, 255, 255, 0.88);
      position: relative;
      z-index: 5;
    }
  </style>
  <script>
    const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado') || 'null');
    if (!usuarioLogado) window.location.href = 'login.html';
  </script>
</head>
<body>
  <img src="LOGO-removebg-preview.png" class="watermark-brasao-fundo" alt="" onerror="this.style.display='none'">

  <!-- CABEÇALHO PADRONIZADO -->
  <header class="top-header">
    <a href="index.html" class="brand-escola">
      <img src="brasaoestado.png" id="logoEscola" alt="Logo" onerror="this.src='LOGO-removebg-preview.png'">
      <div>
        <h1 class="brand-titulo-principal">JOSÉ EUCLIDES</h1>
        <div class="brand-subtitulo">EEMTI DR. JOSÉ EUCLIDES FERREIRA GOMES JÚNIOR</div>
        <div class="brand-slogan">O futuro é gestado agora!</div>
      </div>
    </a>
    <div class="user-bar">
      <span class="fw-bold small text-dark" id="nomeUsuarioUi">
        <i class="bi bi-person-circle text-primary me-1"></i>Carregando...
      </span>
      <span class="badge text-white" style="background-color:#15438c;">Gestão</span>
      <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-bold">
        <i class="bi bi-house-door-fill me-1"></i>Início
      </a>
    </div>
  </header>

  <div class="main-container">
    <!-- CARTÃO 1: CADASTRAR / EDITAR SÉRIE -->
    <div class="card">
      <div class="card-header-custom">
        <h5 class="card-title-text"><i class="bi bi-mortarboard-fill me-2"></i>Cadastrar / Editar Série</h5>
        <span id="badgeEdicaoSerie" class="badge bg-warning text-dark d-none">Modo Edição</span>
      </div>
      <div class="card-body p-3 p-md-4">
        <form id="formSerie">
          <input type="hidden" id="linhaEdit">
          <div class="row g-3 mb-3">
            <div class="col-5 col-md-4">
              <label class="form-label">Ano Letivo *</label>
              <input type="number" id="ano" class="form-control fw-bold" required placeholder="Ex: 2026">
            </div>
            <div class="col-7 col-md-8">
              <label class="form-label">Nome da Série / Turma *</label>
              <input type="text" id="serie" class="form-control fw-bold text-uppercase" required placeholder="Ex: 1ª SÉRIE A">
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="button" id="btnCancelarSerie" class="btn btn-light border fw-bold d-none" onclick="cancelarEdicaoSerie()">Cancelar</button>
            <button type="submit" class="btn-tema flex-grow-1 shadow-sm" id="btnSalvar">
              <i class="bi bi-check-circle-fill me-2"></i>Registrar Série
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- CARTÃO 2: CONSULTAR -->
    <div class="card">
      <div class="card-header-custom">
        <h5 class="card-title-text"><i class="bi bi-search me-2"></i>Consultar e Gerir Séries</h5>
        <button class="btn btn-outline-primary btn-sm fw-bold" onclick="carregarDados()">
          <i class="bi bi-arrow-clockwise me-1"></i>Atualizar Lista
        </button>
      </div>
      <div class="card-body p-3 p-md-4">
        <label class="form-label">Pesquisa Inteligente por Série ou Ano</label>
        <div class="input-group mb-3">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="pesquisa" class="form-control" placeholder="Comece a digitar o nome da série...">
        </div>
        <div class="table-responsive">
          <table class="table table-hover border align-middle mb-0">
            <thead>
              <tr>
                <th style="width: 25%;" class="text-center">Ano</th>
                <th style="width: 55%;">Série / Turma</th>
                <th class="text-center" style="width: 20%;">Ações</th>
              </tr>
            </thead>
            <tbody id="listaDados">
              <tr><td colspan="3" class="text-center py-4 text-muted">Carregando dados...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-custom">
    <strong>© <span id="anoAtual"></span> EEMTI DR. JOSÉ EUCLIDES FERREIRA GOMES JÚNIOR.</strong> Gestão de Séries.
  </footer>

  <script>
    document.getElementById('anoAtual').innerText = new Date().getFullYear();

    const _fetchOriginal = window.fetch;
    window.fetch = function(url, options) {
      if (options && options.method === 'POST' && typeof options.body === 'string') {
        try {
          const uLog = JSON.parse(localStorage.getItem('usuarioLogado') || '{}');
          const nomeAutor = (uLog.nome || uLog.usuario?.nome || uLog.col1 || "").toUpperCase();
          let bodyObj = JSON.parse(options.body);
          if (nomeAutor && !bodyObj.usuarioLogado) bodyObj.usuarioLogado = nomeAutor;
          options.body = JSON.stringify(bodyObj);
        } catch (e) {}
      }
      return _fetchOriginal(url, options);
    };

    const API_URL = "https://script.google.com/macros/s/AKfycbzERHqBAca1K2wCMcqfVXCrulET5ZyMFOyYkXyBcdPyjPnjS28Roga43Sj90O8s5_Om/exec";
    window.onload = carregarDados;

    async function carregarDados() {
      const u = JSON.parse(localStorage.getItem('usuarioLogado') || 'null');
      if (u) {
        let nomeProf = (u.nome || u.usuario?.nome || u.col1 || "USUÁRIO").toUpperCase();
        const elUser = document.getElementById('nomeUsuarioUi');
        if (elUser) elUser.innerHTML = `<i class="bi bi-person-circle text-primary me-1"></i>Olá, ${nomeProf}`;
      }

      document.getElementById('listaDados').innerHTML = '<tr><td colspan="3" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Carregando dados...</td></tr>';
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'listarConfig', tipo: 'SERIE' }) });
      const dados = await res.json();
      let html = '';
      if (dados.lista && dados.lista.length > 0) {
        dados.lista.forEach(item => {
          html += `<tr class="linha-tabela">
            <td class="fw-bold text-center"><span class="badge bg-light text-dark border">${item.col1}</span></td>
            <td class="text-dark fw-bold">${item.col2}</td>
            <td class="text-center text-nowrap">
              <button class="btn-acao btn-editar me-1 shadow-sm" title="Editar" onclick="editar(${item.linha}, '${item.col1}', '${item.col2}')"><i class="bi bi-pencil-fill"></i></button>
              <button class="btn-acao btn-excluir shadow-sm" title="Excluir" onclick="excluir(${item.linha})"><i class="bi bi-trash-fill"></i></button>
            </td>
          </tr>`;
        });
      } else {
        html = '<tr><td colspan="3" class="text-center py-4 text-muted">Nenhuma série cadastrada.</td></tr>';
      }
      document.getElementById('listaDados').innerHTML = html;
    }

    document.getElementById('pesquisa').addEventListener('input', function() {
      const termo = this.value.toLowerCase();
      const linhas = document.querySelectorAll('.linha-tabela');
      linhas.forEach(linha => {
        const texto = linha.textContent.toLowerCase();
        linha.style.display = texto.includes(termo) ? '' : 'none';
      });
    });

    document.getElementById('formSerie').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('btnSalvar').innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Salvando...';
      const payload = {
        action: 'salvarConfig',
        tipo: 'SERIE',
        dados: {
          linha: document.getElementById('linhaEdit').value,
          col1: document.getElementById('ano').value,
          col2: document.getElementById('serie').value.toUpperCase()
        }
      };
      await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      cancelarEdicaoSerie();
      Swal.fire({ title: 'Sucesso!', text: 'Série salva com sucesso.', icon: 'success', confirmButtonColor: '#15438c' });
      carregarDados();
    });

    function editar(linha, col1, col2) {
      document.getElementById('linhaEdit').value = linha;
      document.getElementById('ano').value = col1;
      document.getElementById('serie').value = col2;
      document.getElementById('badgeEdicaoSerie').classList.remove('d-none');
      document.getElementById('btnCancelarSerie').classList.remove('d-none');
      document.getElementById('btnSalvar').innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Atualizar Série';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicaoSerie() {
      document.getElementById('formSerie').reset();
      document.getElementById('linhaEdit').value = "";
      document.getElementById('badgeEdicaoSerie').classList.add('d-none');
      document.getElementById('btnCancelarSerie').classList.add('d-none');
      document.getElementById('btnSalvar').innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Registrar Série';
    }

    async function excluir(linha) {
      const result = await Swal.fire({
        title: 'Tem certeza?',
        text: "Esta ação não pode ser revertida!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Sim, excluir',
        cancelButtonText: 'Cancelar'
      });
      if (result.isConfirmed) {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'excluirConfig', tipo: 'SERIE', linha: linha }) });
        Swal.fire({ title: 'Excluído!', text: 'O registro foi removido.', icon: 'success', confirmButtonColor: '#15438c' });
        carregarDados();
      }
    }
  </script>
</body>
</html>
